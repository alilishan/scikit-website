[project]
name = "scikit-audit"
version = "0.1.0"
description = "Scikit's free Website & SEO Audit: runs the checks and renders a branded one-page report."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.47",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
